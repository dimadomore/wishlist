name: Deploy

# Пуш в main собирает сайт и выкатывает его на Cloudflare.
# Пока в репозитории нет секрета CLOUDFLARE_API_TOKEN, выкатка пропускается,
# а сборка всё равно прогоняется — как проверка, что ничего не сломано.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Выкатить на Cloudflare
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CF_TOKEN }}
